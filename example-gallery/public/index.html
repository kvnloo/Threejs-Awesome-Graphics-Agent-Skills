<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Three.js Visual Example Gallery</title>
    <link rel="stylesheet" href="/gallery/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <svg
            class="brand-mark"
            viewBox="0 0 120 120"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
            aria-hidden="true"
          >
            <ellipse cx="60" cy="26" rx="20" ry="6" />
            <ellipse cx="60" cy="43" rx="34" ry="10.2" stroke-opacity=".85" />
            <ellipse cx="60" cy="60" rx="40" ry="12" stroke-opacity=".7" />
            <ellipse cx="60" cy="77" rx="34" ry="10.2" stroke-opacity=".5" />
            <ellipse cx="60" cy="94" rx="20" ry="6" stroke-opacity=".3" />
          </svg>
          <h1>Example Gallery</h1>
        </div>

        <div class="topbar-actions">
          <label class="search">
            <span>Search</span>
            <input
              id="search"
              type="search"
              placeholder="skill, effect, technique…"
              autocomplete="off"
            />
            <kbd>⌘K</kbd>
          </label>
          <button id="refresh" class="button" type="button">
            <svg
              class="button-icon"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.35"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2.74 6.08A5.6 5.6 0 0 1 13.35 6.36" />
              <path d="M13.35 3.2v3.16h-3.15" />
              <path d="M13.26 9.92A5.6 5.6 0 0 1 2.65 9.64" />
              <path d="M2.65 12.8V9.64h3.15" />
            </svg>
            Refresh
          </button>
          <button
            id="toggle-view"
            class="button button-primary"
            type="button"
            aria-current="true"
          >
            <svg
              class="button-icon"
              viewBox="0 0 16 16"
              stroke="currentColor"
              stroke-width="1.3"
              aria-hidden="true"
            >
              <rect x="1.65" y="1.65" width="5.4" height="5.4" rx="1.1" />
              <rect x="8.95" y="1.65" width="5.4" height="5.4" rx="1.1" />
              <rect x="1.65" y="8.95" width="5.4" height="5.4" rx="1.1" />
              <rect x="8.95" y="8.95" width="5.4" height="5.4" rx="1.1" />
            </svg>
            Overview
          </button>
        </div>
      </header>

      <main class="main-layout">
        <aside class="catalog">
          <div class="catalog-heading">
            <span id="example-count">0 examples</span>
            <span id="runtime-summary">runtime idle</span>
          </div>
          <nav id="example-list" aria-label="Examples"></nav>
        </aside>

        <section class="inspection">
          <div id="empty-state" class="empty-state" hidden>
            <div class="empty-orbit" aria-hidden="true">
              <span></span>
            </div>
            <p class="eyebrow">No visual systems registered</p>
            <h2>Add an example to any skill’s <code>examples/</code> directory.</h2>
            <p>
              The gallery discovers it automatically when the directory contains
              <code>index.html</code> and <code>example.json</code>.
            </p>
          </div>

          <div id="single-view" class="single-view" hidden>
            <div class="toolbar" aria-label="Example controls" hidden>
              <label>
                Viewport
                <select id="viewport">
                  <option value="responsive">Responsive</option>
                  <option value="default">Example default</option>
                  <option value="1920x1080">1920 × 1080</option>
                  <option value="1440x900">1440 × 900</option>
                  <option value="1280x720">1280 × 720</option>
                  <option value="834x1194">834 × 1194</option>
                  <option value="390x844">390 × 844</option>
                </select>
              </label>
              <label>
                DPR
                <select id="dpr">
                  <option value="0.75">0.75</option>
                  <option value="1">1</option>
                  <option value="1.5">1.5</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                </select>
              </label>
              <label>
                Time
                <select id="time-scale">
                  <option value="0.25">0.25×</option>
                  <option value="0.5">0.5×</option>
                  <option value="1">1×</option>
                  <option value="2">2×</option>
                </select>
              </label>
              <label id="debug-control" hidden>
                Debug
                <select id="debug-mode"></select>
              </label>
              <button id="pause" class="button" type="button">Pause</button>
              <button id="reload" class="button" type="button">Reload</button>
              <button id="capture" class="button" type="button">Capture</button>
              <a id="standalone" class="button" target="_blank" rel="noreferrer">
                Standalone
              </a>
            </div>

            <div class="stage-shell">
              <div id="stage" class="stage">
                <iframe
                  id="example-frame"
                  title="Selected Three.js example"
                  allow="fullscreen"
                ></iframe>
              </div>
              <div class="stage-status">
                <span id="frame-status" data-state="idle">idle</span>
                <span id="frame-metrics"></span>
                <span id="frame-size"></span>
              </div>
            </div>
          </div>

          <div id="overview" class="overview" hidden></div>
        </section>
      </main>
    </div>

    <script type="module" src="/gallery/app.js"></script>
  </body>
</html>
