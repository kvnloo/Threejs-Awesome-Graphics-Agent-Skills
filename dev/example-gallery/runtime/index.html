<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Three.js Example Inspection</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body,
      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        display: block;
      }

      body {
        overflow: hidden;
        background: #020305;
      }

      canvas {
        touch-action: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/webgpu": "/node_modules/three/build/three.webgpu.js",
          "three/tsl": "/node_modules/three/build/three.tsl.js",
          "three/addons/": "/node_modules/three/examples/jsm/",
          "@petamoriken/float16": "/node_modules/@petamoriken/float16/src/index.mjs",
          "astronomy-engine": "/node_modules/astronomy-engine/esm/astronomy.js",
          "fflate": "/node_modules/fflate/esm/browser.js",
          "postprocessing": "/node_modules/postprocessing/build/index.js",
          "three-mesh-bvh": "/node_modules/three-mesh-bvh/build/index.module.js",
          "three-stdlib": "/dev/example-gallery/runtime/three-stdlib-exr-loader.js"
        }
      }
    </script>
    <script>
      /* The adapter's import chain only reveals the renderer build three
         round trips in. Start those fetches now, in parallel with the host. */
      (() => {
        const params = new URLSearchParams(window.location.search);
        const modulePath = params.get("module");
        const preloads = ["/node_modules/three/build/three.module.js"];

        if (params.get("galleryBackend") === "webgpu") {
          preloads.push("/node_modules/three/build/three.webgpu.js");
        }
        if (modulePath?.startsWith("/dev/example-gallery/examples/")) {
          preloads.push(modulePath);
        }

        for (const href of preloads) {
          const link = document.createElement("link");
          link.rel = "modulepreload";
          link.href = href;
          document.head.append(link);
        }
      })();
    </script>
  </head>
  <body>
    <canvas></canvas>
    <script type="module" src="./inspection-host.js"></script>
  </body>
</html>
